name: Manual local DMG build

# No tag-triggered releases and no publishing to GitHub Releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DMG artifact (not notarized)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6)
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build universal local DMG
        run: ./scripts/ci-dmg.sh universal
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentPet-Local-DMG
          path: build/AgentPet-Local-*.dmg
          retention-days: 7
