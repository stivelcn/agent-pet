# Included only inside imagepro.ycgod.online's existing HTTPS server.
location = /lumate-updates/latest.json {
    alias /srv/lumate-updates/public/latest.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    limit_except GET HEAD { deny all; }
}
location ^~ /lumate-updates/.sync- { return 404; }
location ^~ /lumate-updates/ {
    alias /srv/lumate-updates/public/;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=300" always;
    limit_except GET HEAD { deny all; }
}
